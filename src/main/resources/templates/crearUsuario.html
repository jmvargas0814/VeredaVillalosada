<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Registrar Usuario - Villalosada</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; }

        .header {
            background-color: #212529;
            color: white;
            padding: 15px;
        }

        .footer {
            background-color: #212529;
            color: white;
            padding: 10px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div class="header d-flex justify-content-between align-items-center">
    <h5>Vereda Villalosada - Registro Usuario</h5>
    <a th:href="@{/admin}" class="text-white text-decoration-none">Volver</a>
</div>

<div class="container mt-5 mb-5">

    <!-- Mensajes -->
    <div th:if="${registroExitoso}" class="alert alert-success mt-3" >

        <h6 class="fw-bold">✅ Usuario registrado correctamente</h6>

        <p>
            <strong>Nombre:</strong>
            <span th:text="${nombreCompleto}"></span>
        </p>

        <p>
            <strong>Username generado:</strong>
            <span th:text="${usernameGenerado}"></span>
        </p>

        <small class="text-muted">
            La contraseña temporal es el número de documento.
        </small>

    </div>
    <div th:if="${mensajeExito}" class="alert alert-success mt-3"
         th:text="${mensajeExito}">
    </div>

    <div th:if="${mensajeError}" class="alert alert-danger mt-3"
         th:text="${mensajeError}">
    </div>


    <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

    <div class="card shadow-sm">
        <div class="card-body">

            <form th:action="@{/usuarios/guardar}" method="post" th:object="${usuario}">

                <div class="row g-3">

                    <div class="col-md-6">
                        <label>Nombres</label>
                        <input type="text" th:field="*{nombres}"  class="form-control fw-bold" th:readonly="${modoEdicion}" required>
                    </div>

                    <div class="col-md-6">
                        <label>Apellidos</label>
                        <input type="text" th:field="*{apellidos}" class="form-control fw-bold" th:readonly="${modoEdicion}" required>
                    </div>

                    <div class="col-md-6">
                        <label>Número Identificación</label>
                        <input type="text" th:field="*{numeroIdentificacion}" class="form-control fw-bold" th:readonly="${modoEdicion}" required>
                    </div>

                    <div class="col-md-6">
                        <label>Correo</label>
                        <input type="email" th:field="*{correo}" class="form-control">
                    </div>
                    <input type="hidden" th:field="*{id}">

                    <div class="col-md-6">
                        <label>Teléfono</label>
                        <input type="text" th:field="*{telefono}" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label>Fecha Nacimiento</label>
                        <input type="date" th:field="*{fechaNacimiento}" class="form-control fw-bold" th:readonly="${modoEdicion}" required>
                    </div>

                    <hr class="mt-4">

                </div>
                <div class="col-md-6" th:if="${modoEdicion}">
                    <label>Estado</label>
                    <select th:field="*{estado}" class="form-select">
                        <option th:value="true">Activo</option>
                        <option th:value="false">Inactivo</option>
                    </select>
                </div>

                <div class="mt-4 d-grid">
                    <button type="submit" class="btn btn-success">
                        Guardar Usuario
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

<div class="footer text-center">
    © 2026 Vereda Villalosada
</div>

</body>
</html>
